<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="大肥鱼的小说工坊 — DSH 网络小说创作插件封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243A61"/>
      <stop offset="0.5" stop-color="#3D5D89"/>
      <stop offset="1" stop-color="#6DC5F2"/>
    </linearGradient>
    <linearGradient id="fishBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCF1FF"/>
